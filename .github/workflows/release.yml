name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # the full CI suite (tests on 3.10-3.14, live Neo4j/GDS, lab scan, UI, wheel, docker, audit, paper)
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # GitHub Release
      packages: write      # ghcr.io image
      id-token: write      # build provenance attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - name: Tag matches the package version
        run: |
          VER="$(python -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("src/linchpin/__init__.py").read())[1])')"
          test "v$VER" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != package version $VER"; exit 1; }
      - name: Build wheel and sdist
        run: pip install build && python -m build
      - name: Release notes from CHANGELOG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## \\[?"v"\\]?( |$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
          cat notes.md
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # semver tags; `latest` is added automatically for the highest non-prerelease version
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build the image locally (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: linchpin:release-candidate
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke-test the image before anything is published
        run: |
          docker run -d --name lp -p 127.0.0.1:8000:8000 linchpin:release-candidate
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/stats > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/stats | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['findings'] == 73, d; print(d)"
          docker rm -f lp
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exactly the image that was smoke-tested
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do docker tag linchpin:release-candidate "$t" && docker push "$t"; done
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' linchpin:release-candidate)"
          digest="${digest##*@}"
          case "$digest" in sha256:*) ;; *) echo "::error::no pushed digest ($digest)"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build provenance for the pushed image (stored next to it in ghcr.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Build provenance for the wheel and sdist
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "LINCHPIN $GITHUB_REF_NAME" --notes-file notes.md
