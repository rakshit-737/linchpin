name: results
# Regenerates the synthetic benchmark and the ablation on a clean runner, so the committed tables in
# benchmarks/results/{summary,ablation}.* name the CI run that produced them (meta.code.github_run_id).
# Manual only: together they take about an hour of runner time. Plans and outcomes are seeded and do not
# depend on the machine; the per-strategy milliseconds do.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.14" }
      - run: pip install -e ".[ml,bench]"
      - name: Synthetic benchmark (4 families x 50 seeds, budget 3)
        run: python benchmarks/run_benchmark.py --seeds 50 --budget 3 --workers "$(nproc)" --out artifacts/benchmark
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: benchmark-results, path: artifacts/benchmark/, if-no-files-found: error }

  ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.14" }
      - run: pip install -e ".[ml,bench]"
      - name: Ablation (4 families x 50 seeds, budget 3)
        run: python benchmarks/ablation.py --seeds 50 --budget 3 --workers "$(nproc)" --out artifacts/ablation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: ablation-results, path: artifacts/ablation/, if-no-files-found: error }
