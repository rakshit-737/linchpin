# Lab-only stack: API + web UI on localhost, optional Neo4j mirror.
#   docker compose up api                       -> http://127.0.0.1:8000/ui (synthetic demo)
#   docker compose --profile neo4j up           -> also Neo4j Browser on http://127.0.0.1:7474
# To serve the real-export case study, mount the dataset dir and set LINCHPIN_SCENARIO.
services:
  api:
    build: .
    image: ghcr.io/rakshit-737/linchpin:latest
    volumes: ["${LINCHPIN_DATA:-../../datasets/linchpin}:/data:ro"]
    environment:
      LINCHPIN_DATA_DIR: /data
      LINCHPIN_SCENARIO: ${LINCHPIN_SCENARIO:-}
    ports: ["127.0.0.1:8000:8000"]
  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/change-me-lab-only
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
