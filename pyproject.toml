[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linchpin"
version = "1.0.0"
description = "Read-only attack-path reasoning and remediation prioritisation over scanner, identity and exploit-intel data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rakshit" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "networkx>=3.2", "pyyaml>=6", "defusedxml>=0.7"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]
neo4j = ["neo4j>=5.14"]
ml = ["scikit-learn>=1.4", "numpy>=1.26", "scipy>=1.11"]
bench = ["matplotlib>=3.8"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27", "ruff==0.8.4", "neo4j>=5.14"]

[project.scripts]
linchpin = "linchpin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linchpin = ["api/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "realdata: needs the downloaded public datasets (scripts/download_data.py); skipped otherwise",
  "neo4j: needs a live Neo4j server (NEO4J_URI / NEO4J_PASSWORD)",
  "ui: browser smoke tests (Playwright + Chromium); skipped when not installed",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", ".linchpin"]
