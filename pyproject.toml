[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI name "linchpin" belongs to an unrelated project (an Ansible provisioner), so the
# distribution is "linchpin-attackpath"; the import package and the CLI are still `linchpin`.
name = "linchpin-attackpath"
dynamic = ["version"]
description = "Read-only attack-path reasoning and remediation prioritisation over scanner, identity and exploit-intel data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rakshit" }]
requires-python = ">=3.10"
keywords = ["attack-graph", "attack-path", "vulnerability-management", "minimum-cut", "epss", "cisa-kev", "bloodhound"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = ["pydantic>=2.5", "networkx>=3.2", "pyyaml>=6", "defusedxml>=0.7"]

[project.urls]
Homepage = "https://rakshit-737.github.io/linchpin/"
Source = "https://github.com/rakshit-737/linchpin"
Changelog = "https://github.com/rakshit-737/linchpin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# starlette >= 1.3.1: the lowest versions fastapi used to allow carry published advisories
api = ["fastapi>=0.135", "starlette>=1.3.1", "uvicorn>=0.29", "httpx>=0.27"]
neo4j = ["neo4j>=5.14"]
ml = ["scikit-learn>=1.5", "numpy>=1.26", "scipy>=1.11"]
bench = ["matplotlib>=3.8"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = ["pytest>=8", "fastapi>=0.135", "starlette>=1.3.1", "httpx>=0.27", "httpx2>=2.13", "ruff==0.16.10",
       "neo4j>=5.14"]

[project.scripts]
linchpin = "linchpin.cli:main"

[tool.setuptools.dynamic]
version = { attr = "linchpin.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linchpin = ["api/static/*", "synth/data/*.csv", "intel/data/*.csv.gz"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "realdata: needs the downloaded public datasets (scripts/download_data.py); skipped otherwise",
  "neo4j: needs a live Neo4j server (NEO4J_URI / NEO4J_PASSWORD)",
  "neo4j_gds: needs a live Neo4j server with the Graph Data Science plugin",
  "ui: browser smoke tests (Playwright + Chromium); skipped when not installed",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", ".linchpin", "site", "paper"]

[tool.ruff.lint]
# Explicit rule set so the result does not depend on the ruff version's defaults. Docstrings (Google
# style) and return annotations are required on the package's public API, not in tests or scripts.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D", "ANN201"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN201"]
"benchmarks/**" = ["D", "ANN201"]
"scripts/**" = ["D", "ANN201"]
"lab/**" = ["D", "ANN201"]
