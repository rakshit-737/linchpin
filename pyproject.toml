[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linchpin"
version = "0.1.0"
description = "Read-only attack-path reasoning and remediation prioritisation over lab/synthetic findings"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "networkx>=3.2", "pyyaml>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
linchpin = "linchpin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
