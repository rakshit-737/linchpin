<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINCHPIN Path Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js" integrity="sha384-IWROdLKRsN1UuJywMlWl7/blXQ8GEooN2n7dzTxfEPd7ybYIKCUJ2Ol/1Gpf3YV4" crossorigin="anonymous"></script>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d2330;--muted:#667085;--line:#e3e5e8;--accent:#1f5fbf;--hot:#c2410c;--ok:#15803d;--kev:#b91c1c}
@media (prefers-color-scheme: dark){:root{--bg:#12151b;--panel:#1a1e26;--ink:#e6e8ec;--muted:#98a2b3;--line:#2a303b;--accent:#6ea3ff;--hot:#fb923c;--ok:#4ade80;--kev:#f87171}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0 12px 0 0;letter-spacing:.02em}
header .stat{color:var(--muted);font-size:13px}
select,input,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{display:grid;grid-template-columns:1fr 420px;height:calc(100vh - 54px)}
#cy{width:100%;height:100%;background:var(--bg)}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
tr.rem{cursor:pointer}tr.rem:hover,tr.rem.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pill{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;border:1px solid var(--line);color:var(--muted)}
.delta{font-size:22px;font-weight:600}
.muted{color:var(--muted);font-size:12px}
#removed span{display:inline-block;margin:2px;padding:1px 6px;border-radius:9px;background:color-mix(in srgb,var(--hot) 18%,transparent);font-size:12px}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}#cy{height:60vh}aside{border-left:0}}
</style>
</head>
<body>
<header>
  <h1>LINCHPIN</h1>
  <label>Topology
    <select id="family">
      <option value="single">single chokepoint</option><option value="multi">multiple pivots</option>
      <option value="none">no chokepoint</option><option value="ad">Active Directory tiers</option>
      <option value="scenario">server scenario (LINCHPIN_SCENARIO)</option>
    </select></label>
  <label>seed <input id="seed" type="number" value="0" style="width:64px"></label>
  <label>budget <input id="budget" type="number" value="3" min="1" max="10" style="width:56px"></label>
  <button class="primary" id="load">Load</button>
  <span class="stat" id="stats"></span>
</header>
<main>
  <div id="cy" aria-label="attack graph"></div>
  <aside>
    <h2>Remediations</h2>
    <p class="muted">Click a row to highlight the attack paths it breaks.</p>
    <table><thead><tr><th>#</th><th>action</th><th>paths</th></tr></thead><tbody id="rems"></tbody></table>
    <p class="muted" id="cut"></p>
    <h2>Top attack paths</h2>
    <table><tbody id="paths"></tbody></table>
    <h2>What-if</h2>
    <p class="muted">Click graph nodes to toggle removal (patch / rotate / isolate). Nothing is persisted.</p>
    <div id="removed"></div>
    <div id="whatif"></div>
    <h2>Node</h2>
    <div id="node" class="muted">Select a node.</div>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let cy, paths = [], removed = new Set();
const COLORS = {Internet:'#6b7280', Host:'#1f5fbf', Service:'#94a3b8', Vuln:'#d97706', Credential:'#7c3aed', Privilege:'#0891b2', DataStore:'#15803d'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path, opts) { const r = await fetch(path, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); }

function draw(g) {
  if (cy) cy.destroy();
  cy = cytoscape({ container: $('#cy'), elements: [...g.nodes, ...g.edges], wheelSensitivity: 0.2,
    style: [
      { selector: 'node', style: { 'background-color': e => COLORS[e.data('label')] || '#999', label: 'data(name)',
          'font-size': 8, color: css('--ink'), 'text-valign': 'bottom', 'text-margin-y': 2, width: 14, height: 14 } },
      { selector: 'node[label="Service"],node[label="Privilege"]', style: { width: 8, height: 8, 'font-size': 6 } },
      { selector: 'node[?crown]', style: { shape: 'star', width: 26, height: 26, 'border-width': 2, 'border-color': css('--ok') } },
      { selector: 'node[?entry]', style: { shape: 'diamond', width: 22, height: 22 } },
      { selector: 'node[?kev]', style: { 'border-width': 2, 'border-color': css('--kev') } },
      { selector: 'edge', style: { width: 1, 'line-color': css('--line'), 'target-arrow-shape': 'triangle',
          'target-arrow-color': css('--line'), 'curve-style': 'bezier', 'arrow-scale': .6 } },
      { selector: '.onpath', style: { 'line-color': css('--accent'), 'target-arrow-color': css('--accent'), width: 2.5, 'z-index': 9 } },
      { selector: 'node.onpath', style: { 'border-width': 2, 'border-color': css('--accent') } },
      { selector: '.broken', style: { 'line-color': css('--hot'), 'target-arrow-color': css('--hot'), width: 3, 'z-index': 10 } },
      { selector: 'node.removed', style: { 'background-color': css('--hot'), shape: 'rectangle' } },
      { selector: '.faded', style: { opacity: .25 } },
    ],
    layout: { name: 'preset' } });
  const roots = cy.nodes('[?entry]');
  cy.layout({ name: 'breadthfirst', directed: true, roots: roots.length ? roots : undefined, spacingFactor: 1.1,
              avoidOverlap: true, circle: false, grid: false }).run();
  cy.on('tap', 'node', async ev => {
    const id = ev.target.id();
    const d = await api('/nodes/' + encodeURIComponent(id));
    $('#node').innerHTML = `<b>${esc(d.id)}</b> <span class="pill">${esc(d.label)}</span><br>` +
      Object.entries(d.props).filter(([k, v]) => v !== null && v !== '' && !(Array.isArray(v) && !v.length)).slice(0, 12)
        .map(([k, v]) => `${esc(k)}: ${esc(Array.isArray(v) ? v.slice(0, 6).join(', ') : v)}`).join('<br>') +
      `<br>in ${d.inbound.length} / out ${d.outbound.length} edges`;
    if (['Vuln', 'Credential', 'Host'].includes(d.label)) { removed.has(id) ? removed.delete(id) : removed.add(id); ev.target.toggleClass('removed'); whatif(); }
  });
}
function highlight(pathIds, cls) {
  cy.elements().removeClass('onpath broken faded');
  if (!pathIds) return;
  const ps = paths.filter(p => pathIds.includes(p.path_id));
  cy.elements().addClass('faded');
  for (const p of ps) {
    p.nodes.forEach(n => cy.getElementById(n).removeClass('faded').addClass(cls));
    p.edges.forEach(e => cy.getElementById(e).removeClass('faded').addClass(cls));
  }
}
async function whatif() {
  $('#removed').innerHTML = [...removed].map(r => `<span>${esc(r)}</span>`).join('');
  if (!removed.size) { $('#whatif').innerHTML = ''; return; }
  const w = await api('/whatif', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ remove_nodes: [...removed] }) });
  const cut = !w.reachable_crown_jewels_after.length;
  $('#whatif').innerHTML = `<div class="delta" style="color:${cut ? 'var(--ok)' : 'var(--hot)'}">${w.paths_before} → ${w.paths_after} paths</div>
    <div class="muted">cheapest path cost ${w.min_cost_before ?? '–'} → ${w.min_cost_after ?? 'none'};
    crown jewels reachable: ${esc(w.reachable_crown_jewels_after.join(', ') || 'none')}</div>`;
}
async function load() {
  const fam = $('#family').value, seed = +$('#seed').value, budget = +$('#budget').value;
  $('#stats').textContent = 'loading…';
  try {
    const st = await api('/demo/load', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ family: fam, seed }) });
    await refresh(budget, st);
  } catch (e) { $('#stats').textContent = 'error: ' + e.message.slice(0, 160); }
}
async function refresh(budget, st) {
  st = st || await api('/stats');
  removed.clear(); $('#removed').innerHTML = ''; $('#whatif').innerHTML = '';
  const [g, rems, ch] = await Promise.all([api('/graph'), api(`/remediations?budget=${budget}`), api('/chokepoints')]);
  paths = await api('/paths?k=100');
  draw(g);
  $('#stats').textContent = `${st.nodes} nodes · ${st.edges} edges · ${paths.length}${paths.length === 100 ? '+' : ''} paths · crown jewels: ${st.crown_jewels.join(', ')}`;
  $('#rems').innerHTML = rems.map((r, i) => `<tr class="rem" data-i="${i}"><td>${i + 1}</td><td>${esc(r.action)}<div class="muted">${esc(r.rationale)}</div></td><td>${r.paths_broken}/${r.paths_total}</td></tr>`).join('')
    || '<tr><td colspan=3 class="muted">No viable attack paths.</td></tr>';
  document.querySelectorAll('tr.rem').forEach(tr => tr.onclick = () => {
    document.querySelectorAll('tr.rem').forEach(t => t.classList.remove('sel')); tr.classList.add('sel');
    highlight(rems[+tr.dataset.i].evidence, 'broken');
  });
  $('#cut').textContent = ch.min_cut_size == null ? 'No finite cut: an entrypoint reaches a crown jewel directly.'
    : `Exact minimum cut: ${ch.min_cut_size} fix(es). Single-node chokepoints: ${ch.chokepoints.length ? ch.chokepoints.join(', ') : 'none'}.`;
  const seen = new Set();
  const uniq = paths.filter(p => { const k = p.nodes.filter(n => /^(host|cred|ds):/.test(n)).join('>'); if (seen.has(k)) return false; seen.add(k); return true; });
  $('#paths').innerHTML = uniq.slice(0, 8).map(p => `<tr class="rem" data-p="${p.path_id}"><td>${p.total_cost.toFixed(3)}</td><td>${esc(p.nodes.filter(n => n.startsWith('host:') || n.startsWith('cred:') || n.startsWith('ds:')).join(' → '))}</td></tr>`).join('');
  document.querySelectorAll('tr[data-p]').forEach(tr => tr.onclick = () => highlight([tr.dataset.p], 'onpath'));
  document.querySelector('tr.rem[data-i]')?.click();  // show the top fix's evidence by default
}
$('#load').onclick = load;
api('/stats').then(st => { if (st.loaded) $('#family').value = st.loaded.split(':')[0]; });
refresh(3).catch(e => $('#stats').textContent = 'error: ' + e.message);
</script>
</body>
</html>
