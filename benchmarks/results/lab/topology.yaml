name: ci-lab-measured
hosts:
- id: app
  match:
  - 172.18.0.4
  - 172.19.0.2
  segment: dmz+core
  internet_facing: true
  datastores: []
- id: cache
  match:
  - 172.19.0.3
  segment: core
  internet_facing: false
  datastores: []
- id: db
  match:
  - 172.19.0.4
  segment: core
  internet_facing: false
  datastores:
  - name: customer-db
    sensitivity: high
- id: proxy
  match:
  - 172.18.0.3
  segment: dmz
  internet_facing: true
  datastores: []
- id: web
  match:
  - 172.18.0.2
  segment: dmz
  internet_facing: true
  datastores: []
reachability:
- from: core
  to: dmz+core
  ports:
  - 8009
  - 8080
- from: dmz
  to: dmz+core
  ports:
  - 8009
  - 8080
- from: dmz+core
  to: core
  ports:
  - 3306
  - 6379
- from: dmz+core
  to: dmz
  ports:
  - 80
crown_jewels:
- auto:sensitivity=high
entrypoints:
- auto:internet_facing
k_shortest: 100
