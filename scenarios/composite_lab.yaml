# Composite lab case study.
#
# FINDINGS are real exports (not generated by LINCHPIN):
#   * OpenVAS scan of Metasploitable 2 and a Greenbone report for a Windows Server 2019 host
#     (DefectDojo unit-test corpus, BSD-3-Clause)
#   * Nessus scan of the public, intentionally vulnerable testphp.vulnweb.com (DefectDojo corpus)
#   * nmap -sV --script vulners output for an OpenSSH 7.4 box, and a multi-service nmap scan
#   * SharpHound v6 collection of the TESTLAB.LOCAL domain (SpecterOps BloodHound test fixtures)
# EXPLOIT INTEL is real: NVD CVSS vectors/sub-scores, FIRST EPSS, CISA KEV.
# TOPOLOGY (segments, firewall rules, which exports sit where, one service-account credential)
# is DECLARED here: the public exports come from unrelated networks, so they are placed into a
# plausible enterprise layout. Results therefore say how LINCHPIN reasons over real finding
# data, not what a real enterprise's exposure is.
name: composite-lab
intel: derived/cve_intel.csv.gz
sources:
  - scans/openvas/many_vuln.xml
  - scans/openvas/report_detail_v2.xml
  - scans/nessus/nessus_with_cvssv3.nessus
  - scans/nmap/nmap_script_vulners.xml
  - scans/nmap/nmap_multiple_port.xml
  - {path: bloodhound/v6, connector: bloodhound}

hosts:
  - {id: msf2, match: [b6b9f466d63, "192.168.1.1001"], segment: dmz, internet_facing: true, os: linux, role: legacy app server}
  - {id: web-php, match: [testphp.vulnweb.com, "44.228.249.3"], segment: dmz, internet_facing: true, os: linux, role: public web app}
  - {id: mail-01, match: [joaquinlp.me, "198.38.82.159"], segment: dmz, internet_facing: true, role: mail/db}
  - {id: jump-ssh, match: ["192.168.0.1"], segment: mgmt, os: linux, role: SSH bastion}
  - {id: app-win, match: [server99, "10.99.99.99"], segment: servers, os: windows, role: Windows app server,
     datastores: [{name: payroll-share, sensitivity: medium}]}
  - {id: win10.testlab.local, segment: workstations}
  - {id: primary.testlab.local, segment: tier0}
  - {id: testmsa.testlab.local, segment: servers}
  - {id: uccomp.testlab.local, segment: workstations}

reachability:
  - {from: dmz, to: servers, ports: [42, 445, 3389]}   # app tier ports exposed to the DMZ
  - {from: dmz, to: mgmt, ports: [5022]}                # bastion SSH
  - {from: mgmt, to: servers, ports: []}                # admins reach everything below tier 0
  - {from: mgmt, to: workstations, ports: []}
  - {from: servers, to: workstations, ports: [445]}
  - {from: workstations, to: tier0, ports: [88, 389, 445]}

credentials:
  # a deployment service account that is local admin on the workstation fleet and whose
  # password is stored in a config file on the Windows app server (a common real-world finding)
  - {principal: svc_deploy, cred_type: password, stored_on: app-win, valid_on: [win10.testlab.local, uccomp.testlab.local]}

crown_jewels: ["auto:sensitivity=high"]
entrypoints: ["auto:internet_facing"]
k_shortest: 50
